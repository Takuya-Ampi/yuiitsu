# 開発・テスト専用。本番では使わない。ライブラリ本体は依存しない。
services:
  postgres:
    image: postgres:18.6
    environment:
      TZ: UTC
      POSTGRES_USER: ${PG_USER:-autoapi}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-autoapi_dev}
      POSTGRES_DB: ${PG_DATABASE:-autoapi_test}
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "${PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4.11
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_USER: ${MYSQL_USER:-autoapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-autoapi_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autoapi_test}
    volumes:
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
